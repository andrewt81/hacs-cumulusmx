name: Review Cumulus MX releases
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create upstream-review --color 0E8A16 --description 'Cumulus MX compatibility review' --force
      - name: Inspect latest stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py
